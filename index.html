<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="./favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B6BCB" />
    <!-- Resource hints for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <!-- Preload critical images with fetchpriority -->
    <link rel="preload" href="./images/Background2.webp" as="image" type="image/webp" fetchpriority="high" />
    <link rel="preload" href="./images/HomePage1.webp" as="image" type="image/webp" fetchpriority="high" />
    <!-- Preload fonts with font-display swap for better performance -->
    <link rel="preload" href="https://fonts.gstatic.com/s/roboto/v30/KFOmCnqEu92Fr1Mu4mxK.woff2" as="font" type="font/woff2" crossorigin />
    <!-- AfterLogin typeface: IBM Plex Sans for UI, Plex Mono for record IDs and figures -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
    <!-- Google Material Symbols Outlined Font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#005dac',
              surface: '#fcf8ff',
              'surface-variant': '#e0e2ec',
              'on-surface': '#191c20',
              'on-surface-variant': '#43474e',
              'lost-danger': '#D32F2F',
              'found-success': '#2E7D32',
              'pending-warning': '#ED6C02',
            }
          }
        }
      }
    </script>
    <meta
      name="description"
      content="Lost Items Community - Find and report lost items in your community"
    />
    <link rel="apple-touch-icon" href="./logo192.png" />
    <link rel="manifest" href="./manifest.json" />
    <title>Lost Items Community</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
